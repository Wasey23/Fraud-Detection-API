name: Fraud Detection API CI/CD

# Trigger the workflow on every push or pull request to the main branch
on:
  push:
    branches: [ "main", "new_model_experiment" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull down your repository code into the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # Step 3: Install all project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Execute automated unit tests using Pytest
      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/

      # Step 5: Verify Docker container builds cleanly
      - name: Test Docker Image Build
        run: |
          docker build -t fraud-detection-api:test .
